# Local / learning Broker config (take-out)
# Production: usually disable autoCreateTopicEnable; brokerIP1 = reachable VIP/hostname

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Host app connects via published ports; use loopback IP announced to clients
brokerIP1 = 127.0.0.1

enablePropertyFilter = true
autoCreateTopicEnable = true

storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
