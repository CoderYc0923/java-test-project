services:
  mysql:
    image: mysql:8.0
    pull_policy: missing # 只在本地缺失时拉取，本地存在镜像就用本地的
    container_name: take-out-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: take_out
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - take-out-mysql-data:/var/lib/mysql
      # 仅数据卷为空时执行一次（新机器首次 up / down -v 后）
      # 仅字符集 + 账号；业务表/种子改由 Liquibase（见 take-out-admin db/changelog）
      - ./docker/mysql/init/00-charset.sql:/docker-entrypoint-initdb.d/00-charset.sql:ro
      - ./docker/mysql/init/01-users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: take-out-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - take-out-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: take-out-rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"

  # Docker named volume 默认属主 root；镜像以 rocketmq 用户跑，必须先 chown 才能写 store/logs
  rocketmq-broker-init:
    image: apache/rocketmq:5.3.1
    user: "0"
    volumes:
      - take-out-rocketmq-broker-store:/home/rocketmq/store
      - take-out-rocketmq-broker-logs:/home/rocketmq/logs
    entrypoint:
      - sh
      - -c
      - chown -R rocketmq:rocketmq /home/rocketmq/store /home/rocketmq/logs
    restart: "no"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: take-out-rocketmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # Broker 比 NameServer 更吃内存；256m 容易启动失败
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - take-out-rocketmq-broker-store:/home/rocketmq/store
      - take-out-rocketmq-broker-logs:/home/rocketmq/logs
      # 不要用 YAML `>` + echo 拼 conf：`>` 会把换行折成空格，配置文件会坏掉
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker-takeout.conf:ro
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker-takeout.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker-init:
        condition: service_completed_successfully

volumes:
  take-out-mysql-data:
  take-out-redis-data:
  take-out-rocketmq-broker-store:
  take-out-rocketmq-broker-logs:
