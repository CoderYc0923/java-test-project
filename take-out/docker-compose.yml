services:
  mysql:
    image: mysql:8.0
    container_name: take-out-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: take_out
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - take-out-mysql-data:/var/lib/mysql
      # 仅数据卷为空时执行一次（新机器首次 up / down -v 后）
      - ./docker/mysql/init/00-charset.sql:/docker-entrypoint-initdb.d/00-charset.sql:ro
      - ./docker/mysql/init/01-users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./sky.sql:/docker-entrypoint-initdb.d/02-sky.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  take-out-mysql-data:
