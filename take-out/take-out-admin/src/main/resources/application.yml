spring:
  application:
    name: take-out-admin
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/take_out?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: takeout_rw
    password: TakeoutRw@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # 默认用 spring.datasource；一般不用再写 url/user/password
    # 本地若想暂时关掉迁移：
    # enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  #激活本地配置（本地有application-local.yml时，会优先使用本地配置）
  profiles:
    include: local
  servlet:
    multipart:
      max-file-size: 5MB # 单文件上限（前端约 2MB，后端稍宽）
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: take-out-admin-producer
    send-message-timeout: 3000

# 支付中心 take-out-pay（详见 docs/tutorials/2026-08-08-pay-package-redis.md）
pay:
    mock-secret: takeout_admin_pay_secret_key_cyrus
    order-idempotent-ttl-seconds: 300
    pay-lock-ttl-seconds: 10
    nonce-ttl-seconds: 600 # 回调nonce去重TTL（秒）
    timestamp-skew-seconds: 300 # 允许的时间戳偏差（秒），防重放
    # 对接假微信
    mock-wechat-base-url: http://127.0.0.1:9090
    merchant-notify-url: http://127.0.0.1:8080/admin/order/mockPay/notify

jwt:
  admin-secret-key: takeout_admin_jwt_secret_key_cyrus
  admin-ttl: 7200000 # 2小时
  admin-token-name: Authorization

oss:
  endpoint: https://oss-cn-shanghai.aliyuncs.com
  bucket: ${OSS_BUCKET:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # 可选：自定义域名；为空则用 https://{bucket}.{endpoint主机}/{key}
  domain: 
  sign-expire-seconds: ${OSS_SIGN_EXPIRE_SECONDS:3600} # 签名 URL 有效期

mq:
  order-paid-topic: takeout-order-paid
  order-paid-tag: ORDER_PAID
  order-paid-consumer-group: take-kitchen-consumer
  outbox-scan-delay-ms: 15000

  kitchen-fail-times: 0
  compensate-topic: takeout-pay-compensate
  compensate-close-tag: CLOSE_CHANNEL
  compensate-refund-tag: REFUND
  compensate-consumer-group: take-pay-compensate-consumer

  take-order-status-topic: takeout-order-status
  take-order-status-consumer-group: take-order-status-consumer
  take-order-confirmed-tag: CONFIRMED
  take-order-delivering-tag: DELIVERY_IN_PROGRESS
  take-order-completed-tag: COMPLETED
  take-order-cancelled-tag: CANCELLED